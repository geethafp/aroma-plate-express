<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSG91 Widget Test</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f6f1ea;
        color: #201a17;
      }

      .wrap {
        max-width: 520px;
        margin: 48px auto;
        padding: 24px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(32, 26, 23, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        line-height: 1.5;
        color: #5f5752;
      }

      label {
        display: block;
        margin: 20px 0 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 16px;
        border: 1px solid #d8cdc4;
        border-radius: 12px;
        font-size: 16px;
      }

      button {
        margin-top: 20px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 600;
        background: #25d366;
        color: #fff;
        cursor: pointer;
      }

      pre {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        background: #171411;
        color: #f4efe8;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>MSG91 Widget Test</h1>
      <p>
        Use this page to test the MSG91 OTP widget outside the main app. If the widget fails here too, the issue is in
        MSG91 widget/account setup rather than our app integration.
      </p>

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" maxlength="10" placeholder="10-digit mobile number" />

      <button id="start">Open MSG91 Widget</button>

      <pre id="output">Waiting for test...</pre>
    </div>

    <script>
      const widgetId = '3663436a6d7a323738383033';
      const tokenAuth = '504234TICy9WZHLOO69ca5fb0P1';
      const output = document.getElementById('output');

      const log = (label, value) => {
        const next = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
        output.textContent = `${label}\n${next}`;
        console.log(label, value);
      };

      const loadScript = (urls) =>
        new Promise((resolve, reject) => {
          let index = 0;

          const attempt = () => {
            const script = document.createElement('script');
            script.src = urls[index];
            script.async = true;
            script.onload = () => resolve();
            script.onerror = () => {
              index += 1;
              if (index < urls.length) {
                attempt();
              } else {
                reject(new Error('Unable to load MSG91 widget script.'));
              }
            };
            document.head.appendChild(script);
          };

          attempt();
        });

      document.getElementById('start').addEventListener('click', async () => {
        const phone = document.getElementById('phone').value.replace(/\D/g, '');

        if (phone.length !== 10) {
          log('Validation error', { error: 'Enter a valid 10-digit phone number.' });
          return;
        }

        try {
          if (typeof window.initSendOTP !== 'function') {
            await loadScript([
              'https://verify.msg91.com/otp-provider.js',
              'https://verify.phone91.com/otp-provider.js',
            ]);
          }

          window.initSendOTP({
            widgetId,
            tokenAuth,
            identifier: `91${phone}`,
            exposeMethods: false,
            success: (data) => log('Widget success', data),
            failure: (error) => log('Widget failure', error),
          });
        } catch (error) {
          log('Setup error', error instanceof Error ? error.message : error);
        }
      });
    </script>
  </body>
  </html>
